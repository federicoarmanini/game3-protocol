<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeStrike</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#050810; --bg2:#0a0f1e; --card:#0c1220;
      --border:rgba(0,212,255,0.12); --neon:#00ff88; --blue:#00d4ff;
      --purple:#b44fff; --red:#ff3355; --text:#d0e8ff; --dim:#5a7a99; --gold:#ffd700;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);}
    .wallet-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.6rem 1.5rem;display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;}
    header{display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1.5rem;background:rgba(5,8,16,0.95);border-bottom:1px solid var(--border);}
    .logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.1rem;background:linear-gradient(90deg,var(--neon),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .layout{display:grid;grid-template-columns:270px 1fr 290px;height:calc(100vh - 90px);}
    .left-panel,.right-panel{background:var(--bg2);border:1px solid var(--border);overflow-y:auto;padding:1rem;}
    .right-panel{border-left:1px solid var(--border);border-right:none;}
    .panel-title{font-family:'Orbitron',monospace;font-size:0.7rem;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:0.8rem;border-bottom:1px solid var(--border);padding-bottom:0.4rem;}
    #grid{display:grid;gap:2px;margin:auto;}
    .cell{width:58px;height:58px;border:1px solid rgba(0,212,255,0.08);border-radius:5px;background:rgba(0,20,40,0.4);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all 0.15s;position:relative;}
    .cell:hover{border-color:var(--blue);transform:scale(1.05);}
    .cell.built{background:var(--card);}
    .cell.hq{border-color:#ffd700!important;background:rgba(255,215,0,0.12)!important;}
    .cell-level{position:absolute;bottom:2px;right:4px;font-size:0.6rem;font-family:'Share Tech Mono',monospace;color:var(--neon);}
    .btn{padding:0.5rem 0.8rem;border-radius:5px;font-family:'Orbitron',monospace;font-size:0.65rem;font-weight:700;cursor:pointer;border:1px solid;transition:all 0.2s;}
    .build-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.7rem 0.4rem;cursor:pointer;text-align:center;transition:all 0.2s;margin-bottom:0.4rem;}
    .build-btn:hover{border-color:var(--blue);}
    .build-btn.selected{border-color:var(--neon);background:rgba(0,255,136,0.08);}
    .claim-btn{width:100%;padding:0.7rem;background:linear-gradient(135deg,var(--neon),var(--blue));color:var(--bg);font-weight:700;border:none;border-radius:6px;cursor:pointer;margin-top:0.8rem;}
    .notif{position:fixed;bottom:120px;right:20px;background:rgba(0,212,255,0.1);border:1px solid var(--blue);padding:0.6rem 1rem;border-radius:6px;z-index:999;}
  </style>
</head>
<body>

<div class="wallet-bar">
  <div><span id="wallet-addr">Not connected</span></div>
  <div style="display:flex;gap:0.8rem;align-items:center;">
    <a href="index.html" class="btn" style="background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);color:var(--blue);text-decoration:none;">← HOME</a>
    <a href="staking.html" class="btn" style="background:rgba(180,79,255,0.1);border-color:rgba(180,79,255,0.4);color:var(--purple);text-decoration:none;">STAKE</a>
    <button onclick="connectWallet()" class="btn" id="connect-btn">CONNECT WALLET</button>
  </div>
</div>

<header>
  <div class="logo">⬡ NODESTRIKE</div>
  <div style="display:flex;gap:1.8rem;align-items:center;">
    <div>⚡ <span id="res-energy">250</span></div>
    <div>💾 <span id="res-data">180</span></div>
    <div>🔧 <span id="res-credits">320</span></div>
    <div>🛡️ <span id="res-defense">45</span></div>
  </div>
  <div id="game-time">DAY 1 — 00:00</div>
</header>

<div class="layout">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="panel-title">Buildings</div>
    <div id="build-menu"></div>

    <div class="panel-title" style="margin-top:1.3rem;">Node Level</div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:0.3rem;">
        <span>Lv <span id="node-level">1</span></span>
        <span id="xp-text">0 / 100</span>
      </div>
      <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
        <div id="xp-bar" style="height:100%;background:linear-gradient(90deg,var(--neon),var(--blue));width:0%;"></div>
      </div>
    </div>

    <div style="margin-top:1rem;font-size:0.85rem;color:#ffd700;">
      Prestige: <span id="prestige-level">0</span> 
      <span style="color:#00ff88;">×<span id="prestige-multi">1.00</span></span>
    </div>
  </div>

  <!-- CENTER -->
  <div class="game-area" style="display:flex;flex-direction:column;">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
      <div id="grid"></div>
    </div>
    <div id="event-ticker" style="background:var(--bg2);padding:0.6rem 1rem;border-top:1px solid var(--border);font-family:'Share Tech Mono',monospace;font-size:0.75rem;color:var(--dim);">
      System started. Build buildings to produce resources.
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="panel-title">Selection</div>
    <div id="selected-info" style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;min-height:120px;margin-bottom:1rem;"></div>

    <!-- RAID -->
    <div style="margin-top:1rem;background:#0f1825;border:1px solid rgba(255,51,85,0.3);border-radius:12px;padding:1.1rem;">
      <div class="panel-title" style="color:#ff3355;border-bottom-color:rgba(255,51,85,0.3);">⚔️ PvP RAID</div>
      <button onclick="scoutEnemy()" class="btn" style="width:100%;margin-bottom:0.5rem;background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);color:#00d4ff;">🔍 SCOUT</button>
      <div id="raid-info" style="font-size:0.85rem;color:#a0b4d4;min-height:36px;margin-bottom:0.5rem;">Scout first</div>
      <button onclick="launchRaid()" class="btn" style="width:100%;background:rgba(255,51,85,0.15);border:1px solid #ff3355;color:#ff3355;">LAUNCH RAID</button>
    </div>

    <button onclick="prestigeReset()" class="btn" style="width:100%;margin-top:0.8rem;background:rgba(255,215,0,0.1);border:1px solid #ffd700;color:#ffd700;">
      🌟 PRESTIGE NODE
    </button>

    <!-- $NODE -->
    <div style="margin-top:1rem;background:var(--card);border:1px solid rgba(0,255,136,0.3);border-radius:10px;padding:1rem;text-align:center;">
      <div style="font-size:0.75rem;color:var(--dim);">$NODE Accumulated</div>
      <div id="game-balance" style="font-family:'Orbitron',monospace;font-size:1.6rem;font-weight:900;color:var(--neon);">0.00</div>
      <button onclick="claimTokens()" class="claim-btn" id="claim-btn" disabled>CLAIM $NODE ON-CHAIN</button>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "https://nodestrike-backend.onrender.com";
const GRID_SIZE = 9;

const BUILDINGS = {
  hq:      { name: "Headquarters", icon: "🏛️", maxLevel: 5, cost: {credits:0}, prod: {energy:1.5, data:1}, description: "Your main node" },
  reactor: { name: "Reactor", icon: "⚡", maxLevel: 5, cost: {credits:120, energy:30}, prod: {energy:4}, description: "Produces Energy" },
  server:  { name: "Server Farm", icon: "💾", maxLevel: 5, cost: {credits:100, energy:40}, prod: {data:3.5}, description: "Produces Data" },
  miner:   { name: "Token Miner", icon: "⛏️", maxLevel: 4, cost: {credits:250, energy:80, data:60}, prod: {game:0.08}, description: "Produces $NODE" },
  drone:   { name: "Drone Bay", icon: "🚁", maxLevel: 4, cost: {credits:220, energy:70, data:50}, prod: {attack:12}, description: "Increases Attack Power" },
  turret:  { name: "Turret", icon: "🔫", maxLevel: 4, cost: {credits:150, data:60}, prod: {defense:10}, description: "Increases Defense" },
  shield:  { name: "Shield Gen", icon: "🛡️", maxLevel: 3, cost: {credits:280, data:100}, prod: {defense:18}, description: "Strong Defense" },
  lab:     { name: "Lab", icon: "🧪", maxLevel: 3, cost: {credits:200, data:80}, prod: {xp:1.5}, description: "Gives XP" }
};

let state = {
  grid: Array(GRID_SIZE * GRID_SIZE).fill(null),
  resources: { energy: 250, data: 180, credits: 320, defense: 20 },
  gameToken: 0,
  xp: 0,
  xpNext: 100,
  level: 1,
  day: 1,
  seconds: 0,
  raidsLaunched: 0,
  selectedBuild: null,
  selectedCell: null
};

const center = Math.floor(GRID_SIZE / 2) * GRID_SIZE + Math.floor(GRID_SIZE / 2);
state.grid[center] = { type: "hq", level: 1, hp: 100, maxHp: 100 };

// Prestige
let prestigeLevel = parseInt(localStorage.getItem('prestigeLevel') || '0');
let prestigeMultiplier = 1 + (prestigeLevel * 0.15);

function updatePrestigeUI() {
  document.getElementById('prestige-level').textContent = prestigeLevel;
  document.getElementById('prestige-multi').textContent = prestigeMultiplier.toFixed(2);
}

function prestigeReset() {
  if (state.level < 8) { showNotif("Reach Level 8 to Prestige", "error"); return; }
  if (!confirm(`Reset for Prestige ${prestigeLevel + 1}?`)) return;

  prestigeLevel++;
  prestigeMultiplier = 1 + (prestigeLevel * 0.15);
  localStorage.setItem('prestigeLevel', prestigeLevel);

  state.grid = Array(GRID_SIZE * GRID_SIZE).fill(null);
  state.grid[center] = { type: "hq", level: 1, hp: 100, maxHp: 100 };
  state.resources = { energy: 280, data: 200, credits: 400, defense: 25 };
  state.gameToken = 0;
  state.level = 1;
  state.xp = 0;
  state.xpNext = 100;

  showNotif(`🌟 Prestige ${prestigeLevel} activated!`, "gold");
  renderGrid();
  updateHUD();
  updatePrestigeUI();
  renderBuildMenu();
}

function showNotif(msg, type = "") {
  const existing = document.querySelector('.notif');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = "notif";
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// GRID 
function renderGrid() {
  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 58px)`;
  gridEl.innerHTML = '';

  state.grid.forEach((cell, i) => {
    const div = document.createElement('div');
    div.className = "cell" + (cell ? " built" : "");
    if (i === center) div.classList.add("hq");

    if (cell) {
      const b = BUILDINGS[cell.type];
      div.innerHTML = `<span>${b.icon}</span><span class="cell-level">Lv${cell.level}</span>`;
    }
    div.onclick = () => onCellClick(i);
    gridEl.appendChild(div);
  });
}

function onCellClick(idx) {
  if (state.selectedBuild && !state.grid[idx]) {
    tryBuild(idx);
  } else {
    state.selectedCell = idx;
    state.selectedBuild = null;
    renderSelected();
    renderBuildMenu();
  }
}

function tryBuild(idx) {
  const type = state.selectedBuild;
  const b = BUILDINGS[type];
  if (!b || type === "hq") return;

  // Checks costs
  for (const [res, amount] of Object.entries(b.cost)) {
    if ((state.resources[res] || 0) < amount) {
      showNotif(`Not enough ${res}!`, "error");
      return;
    }
  }

  // Pays
  for (const [res, amount] of Object.entries(b.cost)) {
    state.resources[res] -= amount;
  }

  state.grid[idx] = { type, level: 1, hp: 100, maxHp: 100 };
  addXP(25);
  showNotif(`Built ${b.name}!`, "gold");
  state.selectedBuild = null;
  renderGrid();
  renderSelected();
  renderBuildMenu();
  updateHUD();
}

function renderSelected() {
  const panel = document.getElementById('selected-info');
  if (state.selectedCell == null) {
    panel.innerHTML = `<div style="text-align:center;color:var(--dim);padding:1.5rem;">Click a cell or select a building</div>`;
    return;
  }

  const cell = state.grid[state.selectedCell];
  if (!cell) {
    panel.innerHTML = `<div style="text-align:center;color:var(--dim);padding:1.5rem;">Empty cell<br>Select a building to place</div>`;
    return;
  }

  const b = BUILDINGS[cell.type];
  const canUpgrade = cell.level < b.maxLevel;
  const upgradeCost = getUpgradeCost(cell.type, cell.level);

  panel.innerHTML = `
    <div style="font-size:2rem;margin-bottom:0.4rem;">${b.icon}</div>
    <div style="font-weight:700;font-size:1rem;">${b.name}</div>
    <div style="color:var(--neon);margin-bottom:0.6rem;">Level ${cell.level} / ${b.maxLevel}</div>
    <div style="font-size:0.85rem;color:var(--dim);margin-bottom:0.8rem;">${b.description}</div>
    ${canUpgrade ? `
      <button onclick="upgradeBuilding(${state.selectedCell})" class="btn" style="width:100%;background:rgba(0,255,136,0.1);border-color:var(--neon);color:var(--neon);">
        ⬆ UPGRADE (${formatCost(upgradeCost)})
      </button>
    ` : `<div style="text-align:center;color:var(--dim);">Max Level</div>`}
  `;
}

function getUpgradeCost(type, level) {
  const base = BUILDINGS[type].cost;
  // Moltiplicatore aggressivo
  const mult = Math.pow(1.85, level);
  const cost = {};
  for (const [res, val] of Object.entries(base)) {
    cost[res] = Math.floor(val * mult * (1 + level * 0.4));
  }
  return cost;
}

function formatCost(cost) {
  return Object.entries(cost).map(([k,v]) => `${v}${k.slice(0,2)}`).join(" ");
}

function upgradeBuilding(idx) {
  const cell = state.grid[idx];
  const b = BUILDINGS[cell.type];
  if (cell.level >= b.maxLevel) return;

  const cost = getUpgradeCost(cell.type, cell.level);

  for (const [res, amount] of Object.entries(cost)) {
    if ((state.resources[res] || 0) < amount) {
      showNotif(`Not enough ${res}!`, "error");
      return;
    }
  }

  for (const [res, amount] of Object.entries(cost)) {
    state.resources[res] -= amount;
  }

  cell.level++;
  cell.maxHp += 40;
  cell.hp = cell.maxHp;
  addXP(40);
  showNotif(`${b.name} → Level ${cell.level}!`, "gold");
  renderGrid();
  renderSelected();
  updateHUD();
}

// BUILD MENU
function renderBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = "";

  Object.keys(BUILDINGS).forEach(type => {
    if (type === "hq") return;
    const b = BUILDINGS[type];
    const div = document.createElement('div');
    div.className = "build-btn" + (state.selectedBuild === type ? " selected" : "");
    div.innerHTML = `
      <div style="font-size:1.4rem;">${b.icon}</div>
      <div style="font-size:0.8rem;font-weight:600;">${b.name}</div>
      <div style="font-size:0.7rem;color:var(--neon);">${formatCost(b.cost)}</div>
    `;
    div.onclick = () => {
      state.selectedBuild = state.selectedBuild === type ? null : type;
      state.selectedCell = null;
      renderBuildMenu();
      renderSelected();
    };
    menu.appendChild(div);
  });
}

// HUD & TICK
function updateHUD() {
  document.getElementById('res-energy').textContent = Math.floor(state.resources.energy);
  document.getElementById('res-data').textContent = Math.floor(state.resources.data);
  document.getElementById('res-credits').textContent = Math.floor(state.resources.credits);
  document.getElementById('res-defense').textContent = Math.floor(state.resources.defense);
  document.getElementById('game-balance').textContent = state.gameToken.toFixed(2);
  document.getElementById('node-level').textContent = state.level;

  const pct = Math.min(100, (state.xp / state.xpNext) * 100);
  document.getElementById('xp-bar').style.width = pct + "%";
  document.getElementById('xp-text').textContent = `${Math.floor(state.xp)} / ${state.xpNext}`;
}

function tick() {
  state.seconds++;

  let energyProd = 0, dataProd = 0, gameProd = 0, xpProd = 0, defProd = 0;

  state.grid.forEach(cell => {
    if (!cell) return;
    const b = BUILDINGS[cell.type];
    const mult = cell.level * prestigeMultiplier * 0.1;

    if (b.prod.energy) energyProd += b.prod.energy * mult;
    if (b.prod.data) dataProd += b.prod.data * mult;
    if (b.prod.game) gameProd += b.prod.game * mult;
    if (b.prod.xp) xpProd += b.prod.xp * mult;
    if (b.prod.defense) defProd += b.prod.defense * 0.05;
  });

  state.resources.energy = Math.min(800, state.resources.energy + energyProd);
  state.resources.data = Math.min(600, state.resources.data + dataProd);
  state.resources.credits += 0.4;
  state.resources.defense = Math.min(300, state.resources.defense + defProd);
  state.gameToken += gameProd;

  if (xpProd > 0) addXP(xpProd);

  updateHUD();
}

function addXP(amount) {
  state.xp += amount;
  while (state.xp >= state.xpNext) {
    state.xp -= state.xpNext;
    state.level++;
    state.xpNext = Math.floor(state.xpNext * 1.55);
    showNotif(`🎉 Level ${state.level}!`, "gold");
  }
}

// RAID WITH COST BASED ON TH 
let enemyDefense = 0;
let hasScouted = false;

function getTownHallLevel() {
  const hq = state.grid.find(c => c && c.type === "hq");
  return hq ? hq.level : 1;
}

function getRaidCost() {
  const thLevel = getTownHallLevel();
  return {
    credits: Math.floor(40 + (thLevel * 35) + (thLevel * thLevel * 8)),
    energy: Math.floor(15 + (thLevel * 12))
  };
}

function scoutEnemy() {
  enemyDefense = Math.floor(Math.random() * 140) + 50;
  hasScouted = true;

  const cost = getRaidCost();
  const chance = calculateSuccessChance();

  document.getElementById('raid-info').innerHTML = `
    Enemy Defense: ~<strong>${enemyDefense}</strong><br>
    Success Chance: <strong>${chance}%</strong><br>
    <span style="color:#ff6b2b">Raid Cost: ${cost.credits} Credits + ${cost.energy} Energy</span>
  `;
}

function calculateSuccessChance() {
  let power = 0;
  state.grid.forEach(cell => {
    if (cell && cell.type === "drone") power += cell.level * 18;
    if (cell && cell.type === "turret") power += cell.level * 7;
  });
  if (power === 0) return 12;
  let chance = Math.floor((power / (enemyDefense * 1.15)) * 100);
  return Math.max(15, Math.min(88, chance));
}

function launchRaid() {
  if (!hasScouted) {
    showNotif("Scout first!", "error");
    return;
  }

  const cost = getRaidCost();

  // Checks resources
  if (state.resources.credits < cost.credits || state.resources.energy < cost.energy) {
    showNotif("Not enough resources to launch raid!", "error");
    return;
  }

  // Pays the cost
  state.resources.credits -= cost.credits;
  state.resources.energy -= cost.energy;

  const chance = calculateSuccessChance();
  const success = Math.random() * 100 < chance;

  if (success) {
    const reward = Math.floor(Math.random() * 110) + 70 + (getTownHallLevel() * 15);
    state.resources.credits += reward;
    showNotif(`⚔️ Raid successful! +${reward} credits`, "gold");
    addXP(50);
  } else {
    const defLoss = Math.floor(Math.random() * 35) + 20;
    const credLoss = Math.floor(Math.random() * 60) + 35;
    state.resources.defense = Math.max(0, state.resources.defense - defLoss);
    state.resources.credits = Math.max(0, state.resources.credits - credLoss);
    showNotif(`❌ Raid failed! Lost ${defLoss} defense`, "error");
  }

  state.raidsLaunched++;
  hasScouted = false;
  document.getElementById('raid-info').innerHTML = "Scout first";
  updateHUD();
}
// BACKEND CONNECTION 

async function savePlayer() {
  if (!window.userAddress) return;

  try {
    await fetch(`${BACKEND_URL}/api/player/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        address: window.userAddress,
        state: {
          grid: state.grid,
          resources: state.resources,
          gameToken: state.gameToken,
          level: state.level,
          xp: state.xp,
          xpNext: state.xpNext,
          seconds: state.seconds,
          raidsLaunched: state.raidsLaunched
        }
      })
    });
  } catch (err) {
    console.error("Save failed:", err);
  }
}
async function connectWallet() {
  if (typeof window.ethereum === "undefined") {
    showNotif("Please install MetaMask!", "error");
    return;
  }

  try {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    const address = accounts[0];

    window.userAddress = address;

    // Mostra l'indirizzo nella barra
    document.getElementById("wallet-addr").textContent = 
      address.slice(0, 6) + "..." + address.slice(-4);

    document.getElementById("connect-btn").textContent = "CONNECTED";

    // Carica i progressi dal backend
    await loadPlayer();

    showNotif("Wallet connected!", "gold");
  } catch (err) {
    console.error(err);
    showNotif("Connection failed", "error");
  }
}
  
async function loadPlayer() {
  if (!window.userAddress) return;

  try {
    const res = await fetch(`${BACKEND_URL}/api/player/load`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address: window.userAddress })
    });

    const data = await res.json();

    if (data.exists && data.state) {
      if (data.state.grid) state.grid = data.state.grid;
      if (data.state.resources) state.resources = data.state.resources;
      if (data.state.gameToken) state.gameToken = data.state.gameToken;
      if (data.state.level) state.level = data.state.level;
      if (data.state.xp) state.xp = data.state.xp;
      if (data.state.xpNext) state.xpNext = data.state.xpNext;

      if (data.offlineTokens > 0) {
        showNotif(`+${data.offlineTokens.toFixed(2)} $NODE offline!`, "gold");
      }

      renderGrid();
      updateHUD();
      showNotif("Progress loaded!", "gold");
    }
  } catch (err) {
    console.error("Load failed:", err);
  }
}

//  INIT 
function init() {
  renderGrid();
  renderBuildMenu();
  updateHUD();
  updatePrestigeUI();
  setInterval(tick, 500);
  setInterval(savePlayer, 30000); 
}

init();
</script>
</body>
</html>
